<div class="navcontainer">
  <nav class="navbar navbar-expand-lg navbar-light bg-dark custom_container m-auto">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Package-tracker</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto custom_ul">
          <li class="nav-item ">
            <a class="btn btn-secondary mx-3" aria-current="page" routerLink="/home">Home</a>
          </li>
          <li class="nav-item ">
            <a class="btn btn-secondary mx-3" routerLink="/order-page">Order Page</a>
          </li>
          <li class="nav-item ">
            <a class="btn btn-secondary mx-3" routerLink="/my-orders">My Orders</a>
          </li>
          <li class="nav-item">
            <button class="btn btn-outline-danger mx-3" (click)="logout()">Logout</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>


</div>

<div class="custom-container d-flex justify-content-center align-items-center">
  <div class="custom-card bg-light m-auto p-4">
    <h2 class="title fw-bold text-center">My Orders</h2>

    <div *ngIf="successMessage" class="alert alert-success text-center">
      {{ successMessage }}
    </div>
  <div *ngIf="errorMessage" class="alert alert-danger text-center">
    {{ errorMessage }}
  </div>
    <table class="table mt-4">
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Seller ID</th>
          <th>Courier ID</th>
          <th>Number of Items</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let order of orders">
          <td>{{ order.order_id }}</td>
          <td>{{ order.seller_id }}</td>
          <td *ngIf="order.courier_id != null ">{{ order.courier_id }}</td>
          <td *ngIf="order.courier_id == null ">Not Assigned</td>
          <td>{{ order.number_of_items }}</td>
          <td>{{ order.status }}</td>
          <td>

            <button class="btn btn-info me-1" [routerLink]="['/order-details', order.order_id]">Details</button>
            <button *ngIf="order.status == 'pending'" class="btn btn-danger ms-1" (click)="cancelOrder(order.order_id)">Cancel</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
